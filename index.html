<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>OFIN Ledger - Corporate Finance</title>
    <!-- Thư viện MathJax để hiển thị công thức -->
    <script>
      window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f7f5ef; color: #1b2430; line-height: 1.6; padding: 0; margin: 0; }
        .masthead { background: #0f5c4c; color: #eef3ef; padding: 20px; border-bottom: 3px double #b8843a; }
        nav { display: flex; overflow-x: auto; padding: 10px 0; background: #0a3f34; }
        nav button { background: none; border: none; color: #cfe0d8; padding: 10px; cursor: pointer; white-space: nowrap; }
        nav button.active { color: #fff; font-weight: bold; border-bottom: 2px solid #b8843a; }
        main { max-width: 900px; margin: 20px auto; padding: 20px; background: white; border: 1px solid #d8d2c2; }
        .formula { background: #fbfaf5; padding: 15px; border-left: 5px solid #0f5c4c; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>

<header class="masthead">
    <h1>The OFIN Ledger</h1>
    <nav id="nav"></nav>
</header>

<main id="main"></main>

<script>
// Dữ liệu bao gồm 9 Lectures
const LECTURES = [
    { id: 1, code: "L01", title: "Intro to Finance", blocks: [{ h: "Giá trị thời gian của tiền", content: "Công thức cơ bản: $$PV = \\frac{FV}{(1+r)^n}$$" }] },
    { id: 2, code: "L02", title: "Time, Money & Interest", blocks: [{ h: "Annuity & Perpetuity", content: "Giá trị dòng tiền đều: $$PV = C \\times \\frac{1-(1+r)^{-n}}{r}$$" }] },
    { id: 3, code: "L03", title: "Investment Rules", blocks: [{ h: "NPV & IRR", content: "NPV = PV(Benefits) - PV(Costs)" }] },
    { id: 4, code: "L04", title: "Capital Budgeting", blocks: [{ h: "FCF Calculation", content: "FCF = EBIT(1-t) + Dep - CapEx - \\Delta NWC" }] },
    { id: 5, code: "L05", title: "Valuing Bonds", blocks: [{ h: "Bond Pricing", content: "Giá trái phiếu = PV(Coupons) + PV(Face Value)" }] },
    { id: 6, code: "L06", title: "Valuing Stocks", blocks: [{ h: "Gordon Growth Model", content: "$$P_0 = \\frac{Div_1}{r - g}$$" }] },
    { id: 7, code: "L07", title: "Risk & Return", blocks: [{ h: "Portfolio Risk", content: "Đa dạng hóa giúp giảm rủi ro riêng biệt." }] },
    { id: 8, code: "L08", title: "CAPM", blocks: [{ h: "CAPM Model", content: "$$E[R] = r_f + \\beta(E[R_m] - r_f)$$" }] },
    { id: 9, code: "L09", title: "Derivatives", blocks: [{ h: "Forwards, Futures & Options", content: "Phái sinh là hợp đồng dựa trên tài sản cơ sở. Call option: quyền mua. Put option: quyền bán." }] }
];

let currentIdx = 0;

function render() {
    const nav = document.getElementById('nav');
    nav.innerHTML = LECTURES.map((l, i) => `<button class="${i===currentIdx?'active':''}" onclick="currentIdx=${i}; render();">${l.code}</button>`).join('');
    
    const l = LECTURES[currentIdx];
    const main = document.getElementById('main');
    main.innerHTML = `<h2>${l.code}: ${l.title}</h2>` + l.blocks.map(b => `<h3>${b.h}</h3><div class="formula">${b.content}</div>`).join('');
    
    // Yêu cầu MathJax render lại công thức
    if(window.MathJax) MathJax.typesetPromise();
}
render();
</script>
</body>
</html>
