  blocks:[
    {
      h_en:"What is Finance? / Main Areas", h_vi:"Tài chính là gì? Các mảng chính",
      en:`Finance deals with how individuals, businesses, and institutions allocate scarce resources over time, under uncertainty[cite: 1]. Three main areas:
      <ul><li><b>Capital Markets & Capital Market Theory</b> — pricing of risky assets, interest rate structure[cite: 1].</li>

    {

$$i_{real} = \\frac{1 + i_{nom}}{1 + e} - 1$$`

{

  viSub:"Giá trị thời gian của tiền (nâng cao) & Cấu trúc lãi suất",

     formula:`$$EAR = \\left(1 + \\frac{APR}{k}\\right)^k - 1$$

        fb:`Đây là một Growing Annuity do có kỳ hạn giới hạn là 30 năm và có tốc độ tăng trưởng 5% mỗi năm[cite: 1]. Lưu ý công thức vẫn tính được dù $g > r$ vì kỳ hạn $N$ hữu hạn[cite: 1].`}
},
{
  id:3, code:"L03", enTitle:"Investment Decision Rules",
  viSub:"Các quy tắc ra quyết định đầu tư: NPV, IRR, Payback, PI",
  reading:"Reading: CF-B&D, Ch. 7",
  blocks:[
    {h_en:"NPV Investment Rule", h_vi:"Quy tắc NPV",
     en:`NPV Rule: accept a project if $NPV > 0$. NPV directly measures value created[cite: 1].`,
     vi:`NPV luôn là quy tắc chuẩn nhất để đưa ra quyết định vì nó tương thích trực tiếp với mục tiêu tối đa hoá của cải[cite: 1].`},
    {h_en:"IRR Investment Rule & Pitfalls", h_vi:"Quy tắc IRR & Các cạm bẫy",
     en:`IRR is the discount rate that sets $NPV = 0$. Pitfalls: multiple IRRs with non-conventional cash flows, cannot compare mutually exclusive projects of different scale[cite: 1].`,
     vi:`Ba bẫy kinh điển của IRR: (1) Dòng tiền đổi dấu nhiều lần gây ra đa nghiệm, (2) Không phản ánh quy mô dự án (Scale), (3) Giả định tái đầu tư phi thực tế[cite: 1].`,
     formula:`$$NPV = \\sum_{t=0}^n \\frac{CF_t}{(1+IRR)^t} = 0$$`},
    {h_en:"Profitability Index (PI)", h_vi:"Chỉ số khả năng sinh lời",
     en:`$PI = \\frac{\\text{Value Created}}{\\text{Resource Consumed}} = \\frac{NPV}{\\text{Resource Consumed}}$. Useful for capital rationing[cite: 1].`,
     vi:`PI dùng để tối ưu hoá việc lựa chọn danh mục dự án khi ngân sách bị giới hạn (Capital Rationing)[cite: 1].`,
     formula:`$$PI = \\frac{\\text{PV(Future Cash Flows)}}{\\text{Initial Investment}}$$`}
  ],
  examples:[
    {title:"So sánh Mutually Exclusive bằng NPV & IRR",
     q:`Dự án Alpha (tuổi thọ 4 năm): $NPV = \\text{&#36;}22,230$, $IRR = 14.47\\%$. Dự án Beta (tuổi thọ 8 năm): $NPV = \\text{&#36;}28,145$, $IRR = 12.78\\%$. Nên chọn dự án nào nếu không xét đến tính lặp lại?[cite: 1]`,
     sol:`Chỉ dựa theo quy tắc NPV, bạn sẽ chọn Beta vì nó tạo ra giá trị tuyệt đối cao hơn (&#36;28,145 > &#36;22,230), mặc dù Beta có IRR thấp hơn Alpha. Bạn KHÔNG được dùng IRR để so sánh các dự án loại trừ lẫn nhau (Mutually Exclusive)[cite: 1].`},
    {title:"Dòng tiền đổi dấu (Non-conventional CF)",
     q:`Dự án phân phối Main Street: Đầu tư &#36;12 triệu, thu &#36;1.8 triệu/năm trong 20 năm, sau đó phải chi &#36;150k/năm vĩnh viễn để bảo trì do hợp đồng thuê đất. Có thể tin tưởng IRR không?[cite: 1]`,
     sol:`Dòng tiền đổi dấu 2 lần (Từ Âm [Đầu tư] $\\rightarrow$ Dương [Doanh thu] $\\rightarrow$ Âm [Bảo trì vĩnh viễn]).<br>
     Dự án này sẽ có tối đa 2 nghiệm IRR (thực tế tính được là $0.61\\%$ và $13.77\\%$). Do đó, quy tắc IRR hoàn toàn vô hiệu, phải dùng NPV[cite: 1].`}
  ],
  traps:[
    "Dùng IRR để xếp hạng dự án Mutually Exclusive là sai lầm phổ biến nhất[cite: 1].",
    "Payback Period bỏ qua dòng tiền sau điểm hoàn vốn và bỏ qua giá trị thời gian của tiền[cite: 1]."
  ],
  quiz:{q:"Khi công ty bị giới hạn vốn đầu tư (Capital Rationing), công cụ nào là phù hợp nhất để lựa chọn tổ hợp các dự án độc lập?",
        opts:["IRR","NPV","Profitability Index (PI)","Payback Period"], correct:2,
        fb:`PI giúp tối đa hoá mức NPV sinh ra trên mỗi đồng vốn bị giới hạn. Bạn sẽ xếp hạng dự án theo PI từ cao xuống thấp cho đến khi hết ngân sách[cite: 1].`}
},
{
  id:4, code:"L04", enTitle:"Fundamentals of Capital Budgeting",
  viSub:"Nền tảng lập ngân sách vốn: FCF & Dự báo Lợi nhuận",
  reading:"Reading: CF-B&D, Ch. 8",
  blocks:[
    {h_en:"From Earnings to Free Cash Flow (FCF)", h_vi:"Từ Lợi nhuận sang Dòng tiền tự do (FCF)",
     en:`Unlevered Net Income = $EBIT \\times (1 - \\tau_c)$. FCF adjusts for non-cash items and investment needs[cite: 1].`,
     vi:`Lợi nhuận kế toán chứa khấu hao (không phải dòng tiền thực) nên cần cộng ngược lại. Phải trừ đi CapEx và thay đổi NWC để ra dòng tiền tự do (FCF)[cite: 1].`,
     formula:`$$\\text{Unlevered NI} = EBIT \\times (1 - \\tau_c)$$
$$FCF = \\text{Unlevered NI} + \\text{Depreciation} - CapEx - \\Delta NWC$$`},
    {h_en:"Opportunity Costs, Externalities, Sunk Costs", h_vi:"Chi phí cơ hội, Ngoại ứng, Chi phí chìm",
     en:`Sunk costs are irrelevant. Opportunity costs and Externalities (like product cannibalization) must be included[cite: 1].`,
     vi:`Sunk cost (chi phí chìm) phải bị loại bỏ. Opportunity costs và Cannibalization (sản phẩm mới làm giảm doanh thu sản phẩm cũ của chính công ty) phải được trừ vào dòng tiền dự án mới[cite: 1].`}
  ],
  examples:[
    {title:"Tính OCF và FCF dự án Titan-X",
     q:`Dự án Titan-X: Doanh thu &#36;25M, Chi phí (COGS+SG&A) &#36;14M, Khấu hao &#36;3M, Thuế 30%, CapEx &#36;0 (năm 1), Tăng NWC $\\Delta NWC = \\text{&#36;}500k$. Tính FCF năm 1.[cite: 1]`,
     sol:`$$EBIT = 25 - 14 - 3 = \\text{&#36;}8M$$
     $$\\text{Unlevered NI} = 8 \\times (1 - 0.30) = \\text{&#36;}5.6M$$
     $$FCF_1 = 5.6 + 3.0 - 0 - 0.5 = \\text{&#36;}8.10M$$[cite: 1].`},
    {title:"Xử lý Thanh lý tài sản (Salvage Value / After-Tax Salvage)",
     q:`Dự án kết thúc, bạn bán thiết bị với giá thị trường &#36;400k. Giá trị sổ sách còn lại là &#36;500k. Mức thuế thu nhập doanh nghiệp 30%. Dòng tiền thanh lý sau thuế (ATSV) là bao nhiêu?[cite: 1]`,
     sol:`Ghi nhận lỗ khi bán (Capital Loss): $400k - 500k = -\\text{&#36;}100k$[cite: 1].<br>
     Tiết kiệm thuế nhờ khoản lỗ này (Tax shield): $-100k \\times 30\\% = -\\text{&#36;}30k$[cite: 1].<br>
     $$ATSV = \\text{Market Value} - \\text{Tax on Gain} = 400k - (-30k) = \\text{&#36;}430k$$[cite: 1].`}
  ],
  traps:[
    "Quên cộng lại Khấu hao vào FCF sau khi đã dùng nó để tính lợi nhuận Unlevered NI[cite: 1].",
    "Đưa Sunk Cost (ví dụ: chi phí khảo sát thị trường đã thanh toán trước khi ra quyết định) vào phân tích NPV[cite: 1]."
  ],
  quiz:{q:"Chi phí nghiên cứu tính khả thi (Feasibility Study) đã được thanh toán 3 tháng trước khi hội đồng quản trị xem xét phê duyệt dự án được phân loại là gì?",
        opts:["Opportunity Cost","Sunk Cost","Externalities","Incremental Cost"], correct:1,
        fb:`Sunk cost (chi phí chìm) là khoản tiền đã chi trả trong quá khứ và không thể thu hồi lại dù dự án có được chấp thuận hay không. Theo nguyên tắc Incremental, phải bỏ qua Sunk cost[cite: 1].`}
},
{
  id:5, code:"L05", enTitle:"Valuing Bonds",
  viSub:"Định giá Trái phiếu: Giá, lợi suất, cấu trúc kỳ hạn",
  reading:"Reading: CF-B&D, Ch. 6",
  blocks:[
    {h_en:"Bond Cash Flows & Pricing", h_vi:"Định giá & Dòng tiền trái phiếu",
     en:`Bond Price = PV(coupons as annuity) + PV(face value).`,
     vi:`Giá trái phiếu là tổng hiện giá của các khoản Coupon (Annuity) cộng với hiện giá của Mệnh giá (Face Value) ở kỳ đáo hạn.`,
     formula:`$$P = C \\times \\left[ \\frac{1 - (1+YTM)^{-N}}{YTM} \\right] + \\frac{FV}{(1+YTM)^N}$$`},
    {h_en:"Price and Yield Relationship", h_vi:"Mối quan hệ Giá - Lợi suất",
     en:`If Coupon Rate > YTM $\\Rightarrow$ price > Face Value (Premium). Convexity shows that prices rise more when yields fall than they drop when yields rise.`,
     vi:`Lãi suất thị trường (YTM) và giá trái phiếu luôn di chuyển ngược chiều nhau. Mối quan hệ này mang tính lồi (Convexity).`}
  ],
  examples:[
    {title:"Định giá trái phiếu khi YTM thay đổi (Lãi suất bán niên)",
     q:`Trái phiếu Gamma có Coupon 6%/năm, trả 6 tháng/lần, kỳ hạn 20 năm, mệnh giá &#36;1,000. Nếu YTM giảm từ 6% xuống 4%, giá trái phiếu mới là bao nhiêu?`,
     sol:`Coupon bán niên: $C = \\frac{60}{2} = \\text{&#36;}30$. Số kỳ $N = 20 \\times 2 = 40$ kỳ. Lãi suất mỗi kỳ $r = \\frac{4\\%}{2} = 2\\%$.<br>
     $$P = 30 \\times \\left[ \\frac{1 - (1.02)^{-40}}{0.02} \\right] + \\frac{1,000}{1.02^{40}} \\approx \\text{&#36;}1,273.55$$`},
    {title:"Phát hiện Arbitrage trên đường cong lợi suất Zero-coupon",
     q:`Giá Zero-coupon 1, 2, 3 năm (Mệnh giá 10k) lần lượt là &#36;9,650, &#36;9,200, &#36;8,700. Trái phiếu coupon 9%/năm, kỳ hạn 3 năm đang bán với giá &#36;11,300. Có cơ hội arbitrage không?`,
     sol:`Tính Hệ số chiết khấu (DF): $DF_1=0.965$, $DF_2=0.920$, $DF_3=0.870$.<br>
     Tính Giá lý thuyết: $P_{theo} = 900(0.965) + 900(0.920) + 10,900(0.870) = \\text{&#36;}11,179.50$.<br>
     So sánh: Giá thị trường (&#36;11,300) > Giá lý thuyết $\\Rightarrow$ Trái phiếu đang bị định giá quá cao. Bán khống trái phiếu này và mua các Zero-coupon tương ứng để chốt lời chênh lệch &#36;120.50.`}
  ],
  traps:[
    "Quên chia đôi lãi suất và nhân đôi số kỳ khi làm bài tập về trái phiếu trả lãi bán niên (Semiannual bond).",
    "Nhầm lẫn giữa Coupon Rate (lãi suất cố định trên hợp đồng, dùng tính dòng tiền) với YTM (lợi suất yêu cầu theo thị trường, dùng làm lãi suất chiết khấu)."
  ],
  quiz:{q:"Nếu một trái phiếu có Coupon Rate < YTM, trái phiếu đó sẽ được giao dịch ở trạng thái nào?",
        opts:["Premium (Giá cao hơn mệnh giá)","Par (Giá bằng mệnh giá)","Discount (Giá thấp hơn mệnh giá)","Không xác định"], correct:2,
        fb:`Khi lãi suất Coupon thấp hơn mức lợi suất thị trường đòi hỏi (YTM), nhà đầu tư sẽ chiết khấu giá của nó xuống dưới mệnh giá (Discount) để bù đắp.`}
},
{
  id:6, code:"L06", enTitle:"Valuing Stocks",
  viSub:"Định giá Cổ phiếu: DDM, Total Payout & DCF",
  reading:"Reading: CF-B&D, Ch. 9",
  blocks:[
    {h_en:"Dividend-Discount Model (DDM)", h_vi:"Mô hình chiết khấu cổ tức",
     en:`Stock price = PV of all future dividends. Constant Growth (Gordon Growth Model): $P_0 = \\frac{Div_1}{r_E - g}$.`,
     vi:`Giá cổ phiếu bằng hiện giá của chuỗi cổ tức tương lai. Công thức Gordon Growth yêu cầu chi phí vốn $r_E > g$.`,
     formula:`$$P_0 = \\frac{Div_1}{r_E - g}$$
$$g = \\text{Retention Rate} \\times \\text{RONI}$$`},
    {h_en:"Total Payout & DCF Models", h_vi:"Tổng chi trả & Chiết khấu dòng tiền (DCF)",
     en:`Total Payout Model values all of the firm's equity using total dividends and repurchases. DCF values Enterprise Value using WACC.`,
     vi:`Mô hình DCF chiết khấu FCF bằng WACC để ra Giá trị Doanh nghiệp (Enterprise Value). Sau đó trừ đi Nợ (Net Debt) để ra Giá trị Vốn hoá (Equity Value).`,
     formula:`$$EV = \\sum_{t=1}^N \\frac{FCF_t}{(1+r_{wacc})^t} + \\frac{V_N}{(1+r_{wacc})^N}$$
$$V_N = \\frac{FCF_{N+1}}{r_{wacc} - g_{FCF}}$$`}
  ],
  examples:[
    {title:"DDM với tốc độ tăng trưởng thay đổi (Multi-stage)",
     q:`Cổ phiếu ART có EPS hiện tại &#36;3.00, tăng 25%/năm trong 3 năm đầu, công ty không trả cổ tức. Từ năm thứ 4 trở đi, EPS tăng đều 5%/năm và công ty trả 50% EPS làm cổ tức. $r_E = 10\\%$. Tính giá $P_0$?`,
     sol:`Tính EPS 3 năm đầu: $EPS_1=3.75$, $EPS_2=4.69$, $EPS_3=5.86$. (Vì Payout = 0 nên $Div_1 = Div_2 = Div_3 = 0$).<br>
     Tính Năm 4: $EPS_4 = 5.86 \\times 1.05 = 6.15$. $Div_4 = 6.15 \\times 50\\% = 3.08$.<br>
     Tính Giá trị cuối kỳ (Terminal Value) tại năm 3: $P_3 = \\frac{Div_4}{r_E - g} = \\frac{3.08}{0.10 - 0.05} = 61.52$.<br>
     Chiết khấu $P_3$ về hiện tại: $$P_0 = \\frac{P_3}{1.10^3} = \\frac{61.52}{1.331} = \\text{&#36;}46.22$$`},
    {title:"Định giá bằng Bội số (Multiples) EV/EBITDA",
     q:`Công ty Alpha có Nợ ròng = &#36;150M, EBITDA = &#36;45M, và 8 triệu cổ phiếu lưu hành. Công ty Beta tương đồng có $EV/EBITDA = 8.5$. Định giá 1 cổ phiếu của Alpha?`,
     sol:`Tính EV của Alpha: $$EV_{\\text{Alpha}} = 8.5 \\times 45 = \\text{&#36;}382.5M$$
     Tính Equity Value: $$\\text{Equity}_{\\text{Alpha}} = 382.5 - 150 = \\text{&#36;}232.5M$$
     Giá mỗi cổ phiếu: $$P_0 = \\frac{232.5}{8} = \\text{&#36;}29.06\\text{/cổ phiếu}$$`}
  ],
  traps:[
    "Sử dụng công thức Gordon Growth khi $g \\geq r_E$ sẽ cho ra kết quả âm hoặc vô cực (lỗi toán học/logic kinh tế).",
    "Quên trừ Net Debt khi muốn chuyển từ Giá trị doanh nghiệp (Enterprise Value) sang Giá trị Cổ phần (Equity Value)."
  ],
  quiz:{q:"Nếu công ty cắt giảm tỷ lệ trả cổ tức để giữ lại tái đầu tư, giá cổ phiếu sẽ tăng KHI VÀ CHỈ KHI:",
        opts:["Tỷ lệ lạm phát giảm","Lợi nhuận trên vốn đầu tư mới (RONI) > chi phí vốn (r_E)","Khấu hao tài sản giảm","Không bao giờ tăng"], correct:1,
        fb:`Việc giữ lại lợi nhuận chỉ tạo ra giá trị gia tăng (làm tăng giá cổ phiếu) nếu dự án mới sinh lời cao hơn mức lợi suất kỳ vọng của cổ đông ($RONI > r_E$).`}
},
{
  id:7, code:"L07 & L08", enTitle:"Risk, Return & The CAPM",
  viSub:"Rủi ro, Lợi nhuận & Lựa chọn danh mục, Mô hình CAPM",
  reading:"Reading: CF-B&D, Ch. 10 & 11",
  blocks:[
    {h_en:"Measuring Risk & Return", h_vi:"Đo lường Rủi ro và Lợi nhuận",
     en:`Variance/Standard Deviation measure the dispersion of returns. Systematic Risk vs. Idiosyncratic Risk.`,
     vi:`Độ lệch chuẩn đo lường tổng rủi ro. Rủi ro riêng biệt (Idiosyncratic) có thể được triệt tiêu qua đa dạng hoá danh mục. Rủi ro hệ thống (Systematic) thì không thể tránh khỏi.`,
     formula:`$$\\sigma^2 = \\sum p_i \\times (R_i - E[R])^2$$
$$\\text{Cov}(R_i, R_j) = \\sum p_k \\cdot (R_{i,k} - E[R_i])(R_{j,k} - E[R_j])$$`},
    {h_en:"Portfolio Risk & CAPM", h_vi:"Rủi ro danh mục & Mô hình CAPM",
     en:`Beta measures sensitivity to systematic risk. CAPM links expected return to Beta and the Market Risk Premium.`,
     vi:`Beta đo lường mức độ rạy cảm với rủi ro hệ thống. Mô hình CAPM xác định lợi nhuận kỳ vọng dựa trên mức phần bù rủi ro thị trường.`,
     formula:`$$E[R_i] = r_f + \\beta_i \\times (E[R_m] - r_f)$$
$$\\beta_i = \\frac{\\text{Cov}(R_i, R_m)}{\\text{Var}(R_m)}$$`}
  ],
  examples:[
    {title:"Tính rủi ro danh mục có tương quan",
     q:`Làm thế nào để giảm rủi ro danh mục (Standard Deviation) mà không làm giảm lợi nhuận kỳ vọng?`,
     sol:`Bằng cách kết hợp các tài sản có hệ số tương quan (Correlation) thấp hoặc âm. Hiệp phương sai (Covariance) âm sẽ bù trừ và làm giảm đáng kể rủi ro tổng thể của danh mục (Hiệu ứng Đa dạng hóa - Diversification).`},
    {title:"Tính Expected Return bằng CAPM",
     q:`Một cổ phiếu có $\\beta = 1.25$. Lãi suất phi rủi ro $r_f = 4\\%$. Phần bù rủi ro thị trường (Market Risk Premium) là 5%. Tính lợi nhuận kỳ vọng?`,
     sol:`Lưu ý: Market Risk Premium chính là cụm $(E[R_m] - r_f)$.<br>
     Áp dụng CAPM:
     $$E[R] = 4\\% + 1.25 \\times 5\\% = 4\\% + 6.25\\% = 10.25\\%$$`}
  ],
  traps:[
    "Thị trường hiệu quả (Efficient Market) không có nghĩa là 'giá luôn chính xác', mà có nghĩa là 'không thể kiếm lời vượt trội một cách có hệ thống bằng các thông tin đã được công bố'.",
    "CAPM sử dụng Market Risk Premium, chính là đại lượng $(E[R_m] - r_f)$, do đó phải nhân Beta với chênh lệch này, TUYỆT ĐỐI không nhân trực tiếp với $E[R_m]$."
  ],
  quiz:{q:"Rủi ro nào sau đây CÓ THỂ bị loại bỏ thông qua việc đa dạng hoá danh mục đầu tư?",
        opts:["Rủi ro suy thoái kinh tế chung","Rủi ro hệ thống (Systematic Risk)","Rủi ro riêng biệt (Idiosyncratic Risk)","Rủi ro lạm phát"], correct:2,
        fb:`Rủi ro riêng biệt (Idiosyncratic Risk) như thay đổi nhân sự quản lý, đình công, hay hoả hoạn tại một nhà máy có thể bị triệt tiêu khi bạn sở hữu một danh mục gồm nhiều cổ phiếu ở các ngành khác nhau.`}
},
{
  id:8, code:"L09", enTitle:"Derivatives: Forwards, Futures & Options",
  viSub:"Phái sinh: Hợp đồng Kỳ hạn, Tương lai & Quyền chọn",
  reading:"Reading: CF-B&D, Ch. 20 & 21",
  blocks:[
    {h_en:"Forwards vs. Futures", h_vi:"Hợp đồng Kỳ hạn (Forwards) và Tương lai (Futures)",
     en:`Forward contracts are OTC, customizable, and carry counterparty risk. Futures contracts are exchange-traded, standardized, and marked-to-market daily.`,
     vi:`Forwards là hợp đồng phi tập trung (OTC), linh hoạt nhưng rủi ro đối tác cao. Futures giao dịch trên sàn, được chuẩn hóa và thanh toán bù trừ hàng ngày (marked-to-market) giúp giảm thiểu rủi ro đối tác.`},
    {h_en:"Options & Payoffs", h_vi:"Quyền chọn và Dòng tiền (Payoffs)",
     en:`Call option gives the right to buy; Put option gives the right to sell at the strike price $K$. Payoff ignores the initial premium, Profit subtracts it.`,
     vi:`Call option là quyền mua, Put option là quyền bán tại giá thực thi $K$. Payoff (dòng tiền đáo hạn) không tính phí ban đầu (premium), trong khi Profit (lợi nhuận) phải trừ đi phí này.`,
     formula:`$$\\text{Payoff}_{\\text{Long Call}} = \\max(S_T - K, 0)$$
$$\\text{Payoff}_{\\text{Long Put}} = \\max(K - S_T, 0)$$`},
    {h_en:"Put-Call Parity", h_vi:"Ngang giá Quyền chọn Mua-Bán",
     en:`The relationship between European call and put prices with the same strike and expiration.`,

     q:`Nhà đầu tư mua 1 Call option với giá thực thi $K = \\text{&#36;}50$, phí quyền chọn (premium) đã trả là &#36;4. Tại thời điểm đáo hạn, giá cổ phiếu $S_T = \\text{&#36;}60$. Tính Payoff và Profit.`,
     sol:`Tính Payoff: $\\max(60 - 50, 0) = \\text{&#36;}10$.<br>

        fb:`Cơ chế Marked-to-market yêu cầu các bên thanh toán lãi/lỗ mỗi ngày vào tài khoản ký quỹ, do đó rủi ro một bên bùng nợ được kiểm soát chặt chẽ.`}

/* ============================================================ RENDER SCRIPT ============================================================ */
let currentIdx = 0;

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = LECTURES.map((l,i)=>`<button data-i="${i}" class="${i===currentIdx?'active':''}">${l.code} · ${l.enTitle.split(':')[0].split('&')[0].trim().slice(0,26)}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ 
    currentIdx = +b.dataset.i; 
    renderAll(); 
    window.scrollTo({top:0,behavior:'smooth'});
  }));
}

function blockHTML(b){
  return `<div class="block">
    <h3><span class="en">${b.h_en}</span><span class="vi">${b.h_vi}</span></h3>
    <div class="two-col">
      <div class="en-col"><span class="label">English (Nguyên gốc)</span>${b.en}</div>
      <div class="vi-col"><span class="label">Giải thích bản chất — Tiếng Việt</span>${b.vi}</div>
    </div>
    ${b.formula ? `<div class="formula">${b.formula}</div>` : ''}
  </div>`;
}

function exampleHTML(ex,i){
  return `<div class="example">
    <div class="ex-title">Ví dụ ${i+1}: ${ex.title}</div>
    <div><b>Đề bài:</b> ${ex.q}</div>
    <details class="solution">
      <summary>Xem đáp án & giải thích chi tiết</summary>
      <div style="margin-top:8px;">${ex.sol}</div>
    </details>
  </div>`;
}

function trapsHTML(traps){
  return `<div class="trap">
    <div class="trap-title">⚠ Lưu ý — Bẫy thi thường gặp</div>
    <ul>${traps.map(t=>`<li>${t}</li>`).join('')}</ul>
  </div>`;
}

function quizHTML(q,idx){
  const opts = q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('');
  return `<div class="quiz" id="quiz-${idx}">
    <div class="q">🧠 Kiểm tra nhanh: ${q.q}</div>
    <div class="opts">${opts}</div>
    <div class="fb" id="fb-${idx}"></div>
  </div>`;
}

function attachQuiz(q, idx){
  const box = document.getElementById(`quiz-${idx}`);
  if(!box) return;
  box.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = +btn.dataset.i;
      box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
      if(i === q.correct){ 
        btn.classList.add('correct'); 
      } else { 
        btn.classList.add('wrong'); 
        box.querySelectorAll('.opt')[q.correct].classList.add('correct'); 
      }
      const fb = document.getElementById(`fb-${idx}`);
      fb.style.display = 'block';
      fb.innerHTML = (i === q.correct ? '✅ Chính xác! ' : '❌ Chưa đúng. ') + q.fb;
    });
  });
}

function renderSection(l, idx){
  return `<section class="section active">
    <div class="lec-head">
      <div class="eyebrow">${l.code} — ${l.reading}</div>
      <h2>${l.enTitle}</h2>
      <div class="vi-sub">${l.viSub}</div>
    </div>
    ${l.blocks.map(blockHTML).join('')}
    <div class="block" style="background:#fbfaf5;">
      <h3><span class="en">Worked Examples</span><span class="vi">Ví dụ minh hoạ có lời giải song ngữ</span></h3>
      ${l.examples.map(exampleHTML).join('')}
    </div>
    ${trapsHTML(l.traps)}
    ${quizHTML(l.quiz, idx)}
    <div class="footer-nav">
      <button id="prevBtn" ${idx===0?'disabled':''}>← Lecture trước</button>
      <button id="nextBtn" ${idx===LECTURES.length-1?'disabled':''}>Lecture tiếp theo →</button>
    </div>
  </section>`;
}

function renderAll(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = renderSection(LECTURES[currentIdx], currentIdx);
  attachQuiz(LECTURES[currentIdx].quiz, currentIdx);
  document.getElementById('progressFill').style.width = ((currentIdx+1)/LECTURES.length*100) + '%';
  
  // Kích hoạt MathJax xử lý lại DOM mỗi khi render màn hình mới
  if (window.MathJax && window.MathJax.typesetPromise) {
    MathJax.typesetPromise([main]).catch(function (err) {
      console.log('MathJax error: ', err.message);
    });
  }

  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  if(prev) prev.addEventListener('click', ()=>{ currentIdx--; renderAll(); window.scrollTo({top:0,behavior:'smooth'});});
  if(next) next.addEventListener('click', ()=>{ currentIdx++; renderAll(); window.scrollTo({top:0,behavior:'smooth'});});
}

// Khởi chạy khi DOM đã sẵn sàng
document.addEventListener("DOMContentLoaded", () => {
    renderAll();
});
</script>
</body>
