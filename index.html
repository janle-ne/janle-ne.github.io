<style>
:root{
  --ink:#1b2430;
  --paper:#f7f5ef;
  --ledger:#0f5c4c;
  --ledger-deep:#0a3f34;
  --gold:#b8843a;
  --red-flag:#a83c34;
  --line:#d8d2c2;
  --card:#ffffff;
  --mono: 'JetBrains Mono', 'Consolas', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Source Serif 4','Georgia',serif;
  line-height:1.55;
}
@font-face{
  font-family:'JetBrains Mono';
  src:local('Consolas');
}
h1,h2,h3,h4{font-family:'Space Grotesk','Arial Narrow',sans-serif; letter-spacing:.01em;}

/* ===== TOP BAR / LEDGER HEADER ===== */
.masthead{
  background:linear-gradient(180deg,var(--ledger-deep),var(--ledger));
  color:#eef3ef;
  padding:28px 5vw 22px;
  position:sticky; top:0; z-index:50;
  border-bottom:3px double var(--gold);
}
.masthead-row{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.masthead h1{font-size:1.5rem; margin:0; font-weight:700;}
.masthead .tag{font-size:.75rem; opacity:.75; font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase;}
.ticker{
  margin-top:10px; font-family:var(--mono); font-size:.72rem; color:#c9ddd3;
  white-space:nowrap; overflow:hidden; opacity:.85;
}

/* ===== NAV — LEDGER TABS ===== */
nav.lecture-nav{
  display:flex; gap:0; overflow-x:auto; margin-top:16px;
  border-top:1px solid rgba(255,255,255,.25);
  scrollbar-width: thin;
}
nav.lecture-nav button{
  flex:0 0 auto;
  background:transparent; border:none; color:#cfe0d8;
  font-family:var(--mono); font-size:.72rem; letter-spacing:.03em;
  padding:10px 14px; cursor:pointer; border-right:1px solid rgba(255,255,255,.15);
  white-space:nowrap; transition:.15s;
}
nav.lecture-nav button:hover{ background:rgba(255,255,255,.08); color:#fff;}
nav.lecture-nav button.active{ background:var(--paper); color:var(--ledger-deep); font-weight:700;}

/* ===== LAYOUT ===== */
main{max-width:920px; margin:0 auto; padding:36px 5vw 120px;}
.section{display:none;}
.section.active{display:block; animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.lec-head{border-bottom:3px solid var(--ink); padding-bottom:14px; margin-bottom:24px;}
.lec-head .eyebrow{font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--gold);}
.lec-head h2{font-size:2rem; margin:.15em 0 .1em;}
.lec-head .vi-sub{font-size:1.05rem; color:#555; font-style:italic;}

.block{
  background:var(--card); border:1px solid var(--line); border-radius:2px;
  padding:20px 24px; margin-bottom:18px; box-shadow:0 1px 0 rgba(0,0,0,.03);
}
.block h3{font-size:1.15rem; margin:0 0 10px; color:var(--ledger-deep); border-left:4px solid var(--gold); padding-left:10px;}
.block h3 .en{font-weight:700;}
.block h3 .vi{display:block; font-size:.85rem; font-weight:400; color:#777; font-family:'Source Serif 4',serif; font-style:italic; margin-top:2px; padding-left:0;}

.two-col{display:grid; grid-template-columns:1fr; gap:14px;}
@media(min-width:720px){ .two-col{grid-template-columns:1fr 1fr;} }
.en-col{border-right:0; padding-right:0;}
@media(min-width:720px){ .en-col{border-right:1px dashed var(--line); padding-right:16px;} }
.en-col .label, .vi-col .label{font-family:var(--mono); font-size:.65rem; text-transform:uppercase; letter-spacing:.1em; color:#999; margin-bottom:6px; display:block;}
.vi-col{color:#2a2a2a;}

.formula{
  background:#fbfaf5; border:1px solid var(--line); border-left:4px solid var(--ledger);
  font-family:var(--mono); padding:14px 16px; margin:10px 0; overflow-x:auto; font-size:.95rem;
}

.example{
  background:#fdf9ef; border:1px solid #e6d9b8; border-radius:2px; padding:16px 18px; margin:14px 0;
}
.example .ex-title{font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); margin-bottom:6px;}

details.solution{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}
details.solution summary{cursor:pointer; font-family:var(--mono); font-size:.75rem; color:var(--ledger); text-transform:uppercase; letter-spacing:.06em;}
details.solution summary::marker{color:var(--gold);}

.trap{
  background:#fbeceb; border:1px solid #e3b6b2; border-left:4px solid var(--red-flag);
  padding:14px 16px; margin:14px 0; border-radius:2px;
}
.trap .trap-title{font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--red-flag); font-weight:700;}

.quiz{
  background:#eef4f0; border:1px solid #cfe0d5; padding:16px 18px; border-radius:2px; margin:14px 0;
}
.quiz .q{font-weight:600; margin-bottom:8px;}
.quiz .opts{display:flex; flex-direction:column; gap:6px;}
.quiz button.opt{
  text-align:left; padding:8px 12px; border:1px solid var(--line); background:#fff; border-radius:2px;
  cursor:pointer; font-family:'Source Serif 4',serif; font-size:.92rem;
}
.quiz button.opt:hover{border-color:var(--ledger);}
.quiz button.opt.correct{background:#d9ecdf; border-color:var(--ledger);}
.quiz button.opt.wrong{background:#f6dcd9; border-color:var(--red-flag);}
.quiz .fb{margin-top:8px; font-size:.88rem; display:none;}

.footer-nav{display:flex; justify-content:space-between; margin-top:36px; border-top:1px solid var(--line); padding-top:16px;}
.footer-nav button{background:var(--ledger); color:#fff; border:none; padding:10px 18px; border-radius:2px; cursor:pointer; font-family:var(--mono); font-size:.75rem;}
.footer-nav button:disabled{opacity:.3; cursor:default;}

.progress-bar{height:3px; background:rgba(255,255,255,.15); margin-top:12px; border-radius:2px; overflow:hidden;}
.progress-fill{height:100%; background:var(--gold); width:11.1%; transition:width .3s;}

::-webkit-scrollbar{height:6px;}
::-webkit-scrollbar-thumb{background:var(--line);}

const LECTURES = [
{
  id:1, code:"L01", enTitle:"Introduction to Finance & The Time Value of Money",
  viSub:"Nhập môn Tài chính, Nguyên lý Định giá & Giá trị thời gian của tiền",
  reading:"Reading: Berk & DeMarzo (CF-B&D), Ch. 3, 4 & 5",
  blocks:[
    {
      h_en:"What is Finance? / Main Areas", h_vi:"Tài chính là gì? Các mảng chính",
      en:`Finance deals with how individuals, businesses, and institutions allocate scarce resources over time, under uncertainty[cite: 1]. Three main areas:
      <ul><li><b>Capital Markets & Capital Market Theory</b> — pricing of risky assets, interest rate structure[cite: 1].</li>
      <li><b>Financial Management (Corporate Finance)</b> — investment decisions & financing decisions of a firm[cite: 1].</li>
      <li><b>Investments</b> — management of individual/institutional portfolios; risk-return trade-off[cite: 1].</li></ul>
      Value of any financial asset = <b>present value of its expected cash flows</b>[cite: 1].`,
      vi:`Bản chất: tài chính là khoa học về việc "định giá thời gian và rủi ro của tiền"[cite: 1]. Ba mảng trên khác nhau ở góc nhìn:
      <ul><li><b>Capital Markets</b>: nhìn từ góc độ thị trường — giá tài sản rủi ro được hình thành thế nào[cite: 1].</li>
      <li><b>Corporate Finance</b>: nhìn từ góc độ doanh nghiệp — nên đầu tư vào đâu (investment decision), lấy tiền từ đâu (financing decision)[cite: 1].</li>
      <li><b>Investments</b>: nhìn từ góc độ nhà đầu tư cá nhân/tổ chức — xây danh mục, đánh đổi rủi ro–lợi nhuận[cite: 1].</li></ul>
      Nguyên lý xuyên suốt cả môn: <b>giá trị = PV của dòng tiền kỳ vọng</b>[cite: 1].`
    },
    {
      h_en:"The Valuation Principle & Competitive Markets", h_vi:"Nguyên lý Định giá & Thị trường Cạnh tranh",
      en:`<b>Valuation Principle:</b> the value of an asset is determined by its competitive market price[cite: 1]. Compare costs & benefits using market prices — not personal taste[cite: 1].
      <br><b>Competitive market:</b> a market where goods can be bought and sold at the same price[cite: 1].`,
      vi:`Ý nghĩa cốt lõi: khi có giá thị trường cạnh tranh, bạn <b>không cần quan tâm bạn thích hay không thích</b> tài sản đó — chỉ cần so giá trị thị trường của lợi ích và chi phí[cite: 1]. Đây là lý do vì sao corporate finance "khách quan hoá" quyết định[cite: 1].`
    },
    {
      h_en:"Time Value of Money — Core Formulas", h_vi:"Giá trị thời gian của tiền — Công thức cốt lõi",
      en:`Two reasons $1 today $\\neq$ $1 in the future: (1) time value / opportunity cost (interest), (2) uncertainty[cite: 1].`,
      vi:`Hai lý do tiền có giá trị theo thời gian: chi phí cơ hội (lãi suất) và sự không chắc chắn trong tương lai[cite: 1].`,
      formula:`$$FV_{t+1} = PV_t \\times (1+r)$$
$$PV_t = \\frac{FV_{t+1}}{1+r}$$
Discount Factor = $\\frac{1}{(1+r)^n}$`
    },
    {
      h_en:"NPV Decision Rule", h_vi:"Quy tắc quyết định NPV",
      en:`NPV expresses the value of an investment decision as an amount of cash received today[cite: 1]. <b>Rule:</b> among mutually exclusive alternatives, take the one with the highest NPV[cite: 1].`,
      vi:`NPV chính là "quy tất cả dòng tiền về một mốc thời gian (hiện tại) rồi cộng lại"[cite: 1]. Chọn NPV cao nhất = tối đa hoá của cải[cite: 1].`,
      formula:`$$NPV = PV(\\text{Benefits}) - PV(\\text{Costs})$$`
    },
    {
      h_en:"Inflation: Nominal vs Real Interest Rates", h_vi:"Lạm phát: lãi suất danh nghĩa vs thực",
      en:`$(1+i_n) = (1+i_r)(1+e)$ — Fisher equation[cite: 1]. Approximation: $i_n \\approx i_r + e$[cite: 1].
      <b>Golden rule:</b> discount real cash flows with real rate; discount nominal cash flows with nominal rate — never mix[cite: 1].`,
      vi:`Đây là bẫy thi phổ biến nhất: <b>không được trộn</b> dòng tiền thực (real) với lãi suất danh nghĩa (nominal), và ngược lại[cite: 1].`,
      formula:`$$(1 + i_{nom}) = (1 + i_{real}) \\times (1 + e)$$
$$i_{real} = \\frac{1 + i_{nom}}{1 + e} - 1$$`
    },
    {
      h_en:"Arbitrage & the Law of One Price", h_vi:"Kinh doanh chênh lệch giá & Luật một giá",
      en:`Law of One Price: equivalent investment opportunities trading in different competitive markets must trade at the same price[cite: 1]. If PV of a security's cash flows $\\neq$ its market price $\\Rightarrow$ arbitrage opportunity exists[cite: 1].`,
      vi:`Nếu giá thị trường $\\neq$ PV lý thuyết, sẽ có cơ hội kinh doanh chênh lệch giá (arbitrage)[cite: 1]. Mua tài sản định giá thấp, bán tài sản định giá cao để hưởng lợi nhuận phi rủi ro[cite: 1].`
    }
  ],
  examples:[
    {title:"PV & Quyết định trả trước hay trả sau",
     q:`Công ty cần mua máy in 3D giá $\\$2,500$ nếu trả ngay. Lựa chọn trả chậm: trả $\\$2,650$ sau 1 năm. Lãi suất phi rủi ro $4\\%$/năm. Nên chọn phương án nào?[cite: 1]`,
     sol:`$$PV = \\frac{\\$2,650}{1.04} = \\$2,548.08$$
     So với giá trả ngay $\\$2,500$ $\\rightarrow$ $PV$ của khoản trả chậm $>$ giá trả ngay[cite: 1].
     Vì đây là chi phí (outflow), ta chọn phương án có PV thấp hơn $\\Rightarrow$ <b>trả tiền mặt ngay hôm nay</b>, tiết kiệm được $\\$48.08$[cite: 1].`},
    {title:"So sánh phương án bán doanh nghiệp",
     q:`Bán ngay $\\$200,000$. Hoặc đầu tư $\\$50,000$ hôm nay, thu lợi nhuận $\\$90,000$ và bán $\\$200,000$ sau 1 năm. Lãi suất $6\\%$. Chọn phương án nào?[cite: 1]`,
     sol:`Bán ngay: $NPV = \\$200,000$[cite: 1].<br>
     Đầu tư thêm: $CF_0 = -\\$50,000$; $CF_1 = \\$290,000$[cite: 1].<br>
     $$PV(CF_1) = \\frac{\\$290,000}{1.06} = \\$273,584.91$$<br>
     $NPV = -\\$50,000 + \\$273,584.91 = \\$223,584.91$[cite: 1].<br>
     $\\Rightarrow$ Chọn <b>phương án đầu tư thêm</b> vì NPV cao hơn[cite: 1].`}
  ],
  traps:[
    "Nhầm lẫn giữa dòng tiền danh nghĩa (Nominal) và lãi suất thực (Real). Luôn dùng tỷ lệ tương ứng[cite: 1].",
    "Với bài toán chi phí, phương án tốt nhất là phương án có PV chi phí thấp nhất[cite: 1]."
  ],
  quiz:{q:"Một dự án yêu cầu bỏ ra $\\$12.00$ triệu hôm nay, trả $\\$5.50$ triệu vào năm 1, và thu về $\\$25.00$ triệu vào năm 1. Lãi suất phi rủi ro $5\\%$. NPV là bao nhiêu?[cite: 1]",
        opts:["$1.57 triệu","$6.57 triệu","$7.50 triệu","$0 triệu"], correct:1,
        fb:`Dòng tiền năm 1: $25.00 - 5.50 = 19.50$[cite: 1]. $PV = \\frac{19.50}{1.05} = 18.57$[cite: 1]. $NPV = -12.00 + 18.57 = 6.57$ triệu[cite: 1].`}
},
{
  id:2, code:"L02", enTitle:"Time, Money and Interest Rates",
  viSub:"Giá trị thời gian của tiền (nâng cao) & Cấu trúc lãi suất",
  reading:"Reading: CF-B&D, Ch. 4 & 5",
  blocks:[
    {h_en:"Perpetuities & Annuities", h_vi:"Dòng tiền vĩnh viễn & Dòng tiền đều",
     en:`Perpetuity: constant cash flow C forever. Annuity: constant cash flow C for N periods[cite: 1].`,
     vi:`PV của perpetuity định giá tại thời điểm <b>ngay trước</b> dòng tiền đầu tiên[cite: 1].`,
     formula:`$$PV_{\\text{Perpetuity}} = \\frac{C}{r}$$
$$PV_{\\text{Growing Perpetuity}} = \\frac{C}{r - g}$$
$$PV_{\\text{Annuity}} = C \\times \\left[ \\frac{1 - (1+r)^{-N}}{r} \\right]$$
$$PV_{\\text{Growing Annuity}} = \\frac{C}{r - g} \\times \\left[ 1 - \\left( \\frac{1+g}{1+r} \\right)^N \\right]$$`},
    {h_en:"Effective Annual Rate (EAR) & Continuous Compounding", h_vi:"EAR & Ghép lãi liên tục",
     en:`When interest compounds more than once per year, convert the APR to an effective rate (EAR)[cite: 1]. Continuous compounding uses Euler's number $e$[cite: 1].`,
     vi:`Lãi suất hiệu dụng (EAR) phản ánh lãi suất thực nhận sau 1 năm. Ghép lãi liên tục dùng hằng số $e$[cite: 1].`,
     formula:`$$EAR = \\left(1 + \\frac{APR}{k}\\right)^k - 1$$
$$FV_{\\text{continuous}} = PV \\times e^{rT}$$`}
  ],
  examples:[
    {title:"Định giá một Growing Perpetuity",
     q:`Quỹ học bổng cần chi $\\$120,000$ mỗi năm mãi mãi. Lợi suất $6\\%$, lạm phát $2.5\\%$. Cần quyên góp bao nhiêu hôm nay?[cite: 1]`,
     sol:`$$PV = \\frac{C}{r - g} = \\frac{\\$120,000}{0.06 - 0.025} = \\frac{\\$120,000}{0.035} = \\$3,428,571.43$$[cite: 1].`},
    {title:"Annuity với khoản thanh toán Balloon",
     q:`Vay $\\$15,000$ trong 5 năm, lãi $8\\%$. Trả đều mỗi năm, nhưng cuối năm 3 trả thêm $\\$4,000$ (balloon). Tính khoản trả đều mới?[cite: 1]`,
     sol:`PV của Balloon: $PV_B = \\frac{4,000}{1.08^3} = \\$3,175.33$[cite: 1].<br>
     Phần PV còn lại phải trả bằng Annuity: $15,000 - 3,175.33 = \\$11,824.67$[cite: 1].<br>
     Tính PMT: $\\$11,824.67 = PMT \\times \\left[ \\frac{1 - 1.08^{-5}}{0.08} \\right] \\Rightarrow PMT = \\$2,961.56$[cite: 1].`}
  ],
  traps:[
    "Perpetuity định giá ngay trước dòng tiền đầu tiên[cite: 1].",
    "Nhầm lẫn APR và EAR. Chỉ dùng EAR hoặc lãi suất theo kỳ để chiết khấu[cite: 1]."
  ],
  quiz:{q:"Trúng số $\\$680$ triệu, trả trong 30 năm, khoản đầu $\\$10.235$ triệu, tăng $5\\%$/năm. Lãi $3\\%$. Dùng công thức nào?[cite: 1]",
        opts:["Perpetuity","Growing Annuity","Annuity thông thường","Không thể tính do g > r"], correct:1,
        fb:`Đây là một Growing Annuity do có kỳ hạn 30 năm và tăng trưởng $5\\%$[cite: 1]. $PV = C_1 \\times \\frac{1 - (\\frac{1+g}{1+r})^n}{r-g}$[cite: 1].`}
},
{
  id:3, code:"L03", enTitle:"Investment Decision Rules",
  viSub:"Các quy tắc ra quyết định đầu tư: NPV, IRR, Payback, PI",
  reading:"Reading: CF-B&D, Ch. 7",
  blocks:[
    {h_en:"NPV Investment Rule", h_vi:"Quy tắc NPV",

     vi:`NPV luôn là quy tắc chuẩn nhất để tối đa hoá giá trị doanh nghiệp[cite: 1].`},
    {h_en:"IRR Investment Rule", h_vi:"Quy tắc IRR (tỷ suất sinh lời nội bộ)",
     en:`IRR: the discount rate that sets $NPV = 0$[cite: 1]. Pitfalls: multiple IRRs with non-conventional cash flows, cannot compare mutually exclusive projects of different scale[cite: 1].`,
     vi:`Ba bẫy của IRR: Dòng tiền đổi dấu nhiều lần gây đa nghiệm (Multiple IRRs), không phản ánh quy mô (Scale), giả định tái đầu tư phi thực tế[cite: 1].`,

     vi:`PI dùng để tối ưu hoá ngân sách bị giới hạn (capital rationing)[cite: 1].`,
     formula:`$$PI = \\frac{\\text{PV(Future Cash Flows)}}{\\text{Initial Investment}}$$`}
  ],
  examples:[

     sol:`Dựa theo NPV, chọn Beta vì nó tạo ra giá trị tuyệt đối cao hơn ($\\$28,145 > \\$22,230$), dù IRR thấp hơn[cite: 1]. IRR không dùng để so sánh các dự án loại trừ lẫn nhau có khác biệt về quy mô hoặc thời gian[cite: 1].`},

/* ============================================================ RENDER ============================================================ */
let currentIdx = 0;

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = LECTURES.map((l,i)=>`<button data-i="${i}" class="${i===currentIdx?'active':''}">${l.code} · ${l.enTitle.split(':')[0].split('&')[0].trim().slice(0,26)}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ currentIdx=+b.dataset.i; renderAll(); window.scrollTo({top:0,behavior:'smooth'});}));
}

function blockHTML(b){
  return `<div class="block">
    <h3><span class="en">${b.h_en}</span><span class="vi">${b.h_vi}</span></h3>
    <div class="two-col">
      <div class="en-col"><span class="label">English (nguyên gốc)</span>${b.en}</div>
      <div class="vi-col"><span class="label">Giải thích bản chất — Tiếng Việt</span>${b.vi}</div>
    </div>
    ${b.formula? `<div class="formula">${b.formula}</div>`:''}
  </div>`;
}

function exampleHTML(ex,i){
  return `<div class="example">
    <div class="ex-title">Ví dụ ${i+1}: ${ex.title}</div>
    <div><b>Đề bài:</b> ${ex.q}</div>
    <details class="solution"><summary>Xem đáp án & giải thích chi tiết</summary><div style="margin-top:8px;">${ex.sol}</div></details>
  </div>`;
}

function trapsHTML(traps){
  return `<div class="trap"><div class="trap-title">⚠ Lưu ý — Bẫy thi thường gặp</div><ul>${traps.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
}

function quizHTML(q,idx){
  const opts = q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('');
  return `<div class="quiz" id="quiz-${idx}">
    <div class="q">🧠 Kiểm tra nhanh: ${q.q}</div>
    <div class="opts">${opts}</div>
    <div class="fb" id="fb-${idx}"></div>
  </div>`;
}

function attachQuiz(q, idx){
  const box = document.getElementById(`quiz-${idx}`);
  if(!box) return;
  box.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = +btn.dataset.i;
      box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
      if(i===q.correct){ btn.classList.add('correct'); }
      else { btn.classList.add('wrong'); box.querySelectorAll('.opt')[q.correct].classList.add('correct'); }
      const fb = document.getElementById(`fb-${idx}`);
      fb.style.display='block';
      fb.innerHTML = (i===q.correct? '✅ Chính xác! ':'❌ Chưa đúng. ') + q.fb;
    });
  });
}

function renderSection(l, idx){
  return `<section class="section active">
    <div class="lec-head">
      <div class="eyebrow">${l.code} — ${l.reading}</div>
      <h2>${l.enTitle}</h2>
      <div class="vi-sub">${l.viSub}</div>
    </div>
    ${l.blocks.map(blockHTML).join('')}
    <div class="block" style="background:#fbfaf5;">
      <h3><span class="en">Worked Examples</span><span class="vi">Ví dụ minh hoạ có lời giải song ngữ</span></h3>
      ${l.examples.map(exampleHTML).join('')}
    </div>
    ${trapsHTML(l.traps)}
    ${quizHTML(l.quiz, idx)}
    <div class="footer-nav">
      <button id="prevBtn" ${idx===0?'disabled':''}>← Lecture trước</button>
      <button id="nextBtn" ${idx===LECTURES.length-1?'disabled':''}>Lecture tiếp theo →</button>
    </div>
  </section>`;
}

function renderAll(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = renderSection(LECTURES[currentIdx], currentIdx);
  attachQuiz(LECTURES[currentIdx].quiz, currentIdx);
  document.getElementById('progressFill').style.width = ((currentIdx+1)/LECTURES.length*100)+'%';
  
  // Render MathJax
  if (window.MathJax) {
    MathJax.typesetPromise();
  }

  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  if(prev) prev.addEventListener('click', ()=>{ currentIdx--; renderAll(); window.scrollTo({top:0,behavior:'smooth'});});
  if(next) next.addEventListener('click', ()=>{ currentIdx++; renderAll(); window.scrollTo({top:0,behavior:'smooth'});});
}

// Khởi tạo
document.addEventListener("DOMContentLoaded", () => {
    renderAll();
});
</script>
